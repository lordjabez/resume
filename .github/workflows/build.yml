name: Build

on:
  push:
    branches:
      - '**'

jobs:
  convert:
    name: Build PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build PDF
        run: bin/build.bash
      - uses: actions/upload-artifact@v7
        with:
          name: resume
          path: resume.pdf
